<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="color-scheme" content="light dark" />
    <title>Dominio en uso</title>
    <meta
      name="description"
      content="Este sitio está en proceso de restauración. Volveremos pronto."
    />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%237c6cf2'/%3E%3Cstop offset='1' stop-color='%23e66fb0'/%3E%3C/linearGradient%3E%3C/defs%3E%3Ccircle cx='16' cy='16' r='14' fill='url(%23g)'/%3E%3Ccircle cx='16' cy='16' r='5' fill='%23fff'/%3E%3C/svg%3E"
    />
    <style>
      :root {
        --bg: #f6f5fb;
        --bg-2: #ecebf7;
        --text: #1b1a2e;
        --muted: #5d5b78;
        --card: rgba(255, 255, 255, 0.55);
        --card-border: rgba(27, 26, 46, 0.08);
        --track: rgba(27, 26, 46, 0.08);
        --accent-1: #7c6cf2;
        --accent-2: #e66fb0;
        --accent-3: #4fb3e8;
        --orb-opacity: 0.45;
        --ok: #22a06b;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0d0c18;
          --bg-2: #15132a;
          --text: #f1f0fa;
          --muted: #a6a3c4;
          --card: rgba(22, 20, 42, 0.55);
          --card-border: rgba(255, 255, 255, 0.08);
          --track: rgba(255, 255, 255, 0.08);
          --orb-opacity: 0.35;
          --ok: #3ccf8e;
        }
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
        margin: 0;
      }

      body {
        min-height: 100svh;
        display: grid;
        place-items: center;
        padding: 24px 16px;
        overflow: hidden;
        font-family:
          ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
          "Helvetica Neue", Arial, sans-serif;
        color: var(--text);
        background: linear-gradient(
          135deg,
          var(--bg) 0%,
          var(--bg-2) 50%,
          var(--bg) 100%
        );
        background-size: 300% 300%;
        animation: drift-bg 18s ease-in-out infinite;
        -webkit-font-smoothing: antialiased;
      }

      /* Orbes de luz flotando al fondo */
      .orbs {
        position: fixed;
        inset: 0;
        pointer-events: none;
        overflow: hidden;
      }

      .orb {
        position: absolute;
        width: 42vmax;
        height: 42vmax;
        border-radius: 50%;
        filter: blur(70px);
        opacity: var(--orb-opacity);
        will-change: transform;
      }

      .orb--1 {
        background: var(--accent-1);
        top: -14vmax;
        left: -10vmax;
        animation: float-1 22s ease-in-out infinite;
      }

      .orb--2 {
        background: var(--accent-2);
        bottom: -16vmax;
        right: -12vmax;
        animation: float-2 26s ease-in-out infinite;
      }

      .orb--3 {
        background: var(--accent-3);
        width: 28vmax;
        height: 28vmax;
        top: 40%;
        left: 55%;
        animation: float-3 30s ease-in-out infinite;
      }

      /* Tarjeta central */
      .card {
        position: relative;
        width: 100%;
        max-width: 520px;
        padding: 48px 40px 40px;
        text-align: center;
        background: var(--card);
        border: 1px solid var(--card-border);
        border-radius: 28px;
        backdrop-filter: blur(18px) saturate(140%);
        -webkit-backdrop-filter: blur(18px) saturate(140%);
        box-shadow: 0 30px 80px -30px rgba(40, 30, 90, 0.35);
        animation: rise 900ms cubic-bezier(0.2, 0.8, 0.2, 1) both;
      }

      .badge {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        padding: 6px 14px 6px 12px;
        border-radius: 999px;
        border: 1px solid var(--card-border);
        background: var(--track);
        font-size: 13px;
        font-weight: 600;
        letter-spacing: 0.02em;
        color: var(--muted);
      }

      .pulse {
        position: relative;
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--ok);
      }

      .pulse::after {
        content: "";
        position: absolute;
        inset: 0;
        border-radius: 50%;
        background: var(--ok);
        animation: ping 1.8s cubic-bezier(0, 0, 0.2, 1) infinite;
      }

      h1 {
        margin: 24px 0 12px;
        font-size: clamp(32px, 7vw, 46px);
        line-height: 1.08;
        letter-spacing: -0.03em;
        font-weight: 750;
        background: linear-gradient(
          90deg,
          var(--text) 0%,
          var(--accent-1) 35%,
          var(--accent-2) 65%,
          var(--text) 100%
        );
        background-size: 250% 100%;
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        animation: shimmer 8s linear infinite;
      }

      p {
        margin: 0 auto;
        max-width: 36ch;
        font-size: 17px;
        line-height: 1.55;
        color: var(--muted);
      }

      /* Barra de progreso indeterminada */
      .progress {
        position: relative;
        height: 4px;
        margin: 36px auto 0;
        max-width: 280px;
        border-radius: 999px;
        background: var(--track);
        overflow: hidden;
      }

      .progress::before {
        content: "";
        position: absolute;
        top: 0;
        bottom: 0;
        width: 40%;
        border-radius: inherit;
        background: linear-gradient(
          90deg,
          var(--accent-1),
          var(--accent-2)
        );
        animation: indeterminate 1.8s cubic-bezier(0.65, 0, 0.35, 1) infinite;
      }

      .dots::after {
        content: "";
        display: inline-block;
        width: 1.2em;
        text-align: left;
        animation: dots 1.6s steps(4, end) infinite;
      }

      @keyframes drift-bg {
        0%,
        100% {
          background-position: 0% 50%;
        }
        50% {
          background-position: 100% 50%;
        }
      }

      @keyframes float-1 {
        0%,
        100% {
          transform: translate(0, 0) scale(1);
        }
        50% {
          transform: translate(14vmax, 10vmax) scale(1.12);
        }
      }

      @keyframes float-2 {
        0%,
        100% {
          transform: translate(0, 0) scale(1);
        }
        50% {
          transform: translate(-12vmax, -9vmax) scale(1.08);
        }
      }

      @keyframes float-3 {
        0%,
        100% {
          transform: translate(-50%, -50%) scale(1);
        }
        33% {
          transform: translate(-80%, -20%) scale(0.9);
        }
        66% {
          transform: translate(-30%, -75%) scale(1.1);
        }
      }

      @keyframes rise {
        from {
          opacity: 0;
          transform: translateY(16px) scale(0.98);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }

      @keyframes ping {
        0% {
          transform: scale(1);
          opacity: 0.7;
        }
        80%,
        100% {
          transform: scale(2.8);
          opacity: 0;
        }
      }

      @keyframes shimmer {
        from {
          background-position: 100% 0;
        }
        to {
          background-position: -150% 0;
        }
      }

      @keyframes indeterminate {
        0% {
          left: -40%;
        }
        100% {
          left: 100%;
        }
      }

      @keyframes dots {
        0% {
          content: "";
        }
        25% {
          content: ".";
        }
        50% {
          content: "..";
        }
        75% {
          content: "...";
        }
      }

      @media (max-width: 480px) {
        .card {
          padding: 40px 24px 32px;
          border-radius: 22px;
        }

        p {
          font-size: 16px;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation: none !important;
        }

        .progress::before {
          left: 30%;
        }

        .dots::after {
          content: "…";
        }
      }
    </style>
  </head>
  <body>
    <div class="orbs" aria-hidden="true">
      <div class="orb orb--1"></div>
      <div class="orb orb--2"></div>
      <div class="orb orb--3"></div>
    </div>

    <main class="card">
      <span class="badge" role="status">
        <span class="pulse" aria-hidden="true"></span>
        <span>Restaurando<span class="dots" aria-hidden="true"></span></span>
      </span>
      <h1>Dominio en uso</h1>
      <p>Este sitio está en proceso de restauración. Volveremos pronto.</p>
      <div class="progress" aria-hidden="true"></div>
    </main>
  </body>
</html>
